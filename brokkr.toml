project = "brokkr"

# Two bin targets since brokkr-rustc-guard; keep bare `brokkr run` on brokkr.
[bin]
default = "brokkr"

[test]
debug = true
default_package = "brokkr"
# Rustdoc is the one compiler pass clippy and the tests never run, so a broken
# intra-doc link in a module header rots unseen. brokkr is a binary crate whose
# doc comments are written for its own developers, so private items are
# documented too.
[rustdoc]
document_private_items = true

# The document-folder rule from CLAUDE.md: docs may not cite source line
# numbers, because they drift the moment the file is edited. Cite the file and
# the symbol instead.
[[textlint]]
name = "docs-cite-no-line-numbers"
pattern = '\b[\w/.-]+\.rs:\d+'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md"]
message = "source line numbers drift; cite the file and the symbol instead"

# The one-way dependency direction from CLAUDE.md: `notes/` carries no truth
# guarantee, so nothing durable may cite it - not a doc, not a code comment,
# which outlives the note it would point at.
[[textlint]]
name = "docs-never-cite-notes"
pattern = '\bnotes/'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md", "scripts/**/*.js", "scripts/**/*.py", "scripts/**/*.sh"]
message = "notes/ is transient; durable docs must carry their own context"

[[textlint]]
name = "durable-docs-avoid-machine-local-paths"
pattern = '/home/'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md"]
message = "durable docs must use portable paths"

# Old tracker labels and machine-local paths are not durable context. Scoped
# to the config/CLI/dispatch layer: other modules still carry such labels, and
# a path joins this list once it is clean.
[[textlint]]
name = "owned-source-comments-have-durable-context"
pattern = '\bS\d+-\d+\b|\b(?:TODO|request|plan|Phase|feature)\s+#?\d+\b|\bQ\d+:|\bC\d+\b|[\w/.-]+\.rs:\d+|/home/'
paths = ["src/config_parts/**/*.rs", "src/project.rs", "src/cli.rs", "src/cli/**/*.rs", "src/command_args.rs", "src/man.rs", "src/man/**/*.rs", "src/main_parts/**/*.rs"]
region = "comment"
message = "comments must explain durable behavior without tracker labels or local paths"

[[textlint]]
name = "owned-source-strings-have-durable-context"
pattern = '\bS\d+-\d+\b|\b(?:TODO|request|plan|Phase|feature)\s+#?\d+\b|\bQ\d+:|\bC\d+\b|[\w/.-]+\.rs:\d+|\bnotes/|/home/'
paths = ["src/config_parts/**/*.rs", "src/project.rs", "src/cli.rs", "src/cli/**/*.rs", "src/command_args.rs", "src/man.rs", "src/man/**/*.rs", "src/main_parts/**/*.rs"]
exclude = ["src/config_parts/tests.rs"]
region = "string"
message = "user-facing strings must not expose tracker labels or machine-local paths"

[[textlint]]
name = "dataset-defaults-have-one-owner"
pattern = 'default_value\s*=\s*"(?:denmark|raw|indexed)"'
paths = ["src/cli/schema.rs"]
region = "code"
message = "use the shared dataset and variant defaults from src/cli/schema.rs"

# The same rule for code comments. `region = "comment"` because string literals
# legitimately name `notes/` paths, as test data for the dirt classifier does.
[[textlint]]
name = "comments-never-cite-notes"
pattern = '\bnotes/'
paths = ["src/**/*.rs"]
region = "comment"
message = "notes/ is transient; a code comment must carry its own context"

# Project and per-user state paths belong to the typed layout owners.
[[textlint]]
name = "brokkr-state-paths-use-layouts"
pattern = '"(?:[^"]*[/"])?\.brokkr(?:/|")'
paths = ["src/**/*.rs"]
exclude = ["src/clean/layout.rs", "src/user_dirs.rs", "src/user_dirs/paths.rs", "src/lock_protocol.rs"]
region = "string"
message = "construct .brokkr paths through ProjectState, a project layout, or user_dirs"

# The toolchain probe has one owner, which caches it per invocation. The guard
# binary's argument classifier recognises the flag; it never runs it.
[[textlint]]
name = "rustc-version-probe-has-one-owner"
pattern = '-vV\b'
paths = ["src/**/*.rs"]
exclude = ["src/cargo/rustc.rs", "src/bin/rustc_guard.rs"]
region = "string"
message = "query the toolchain through crate::cargo::rustc::load, not a fresh rustc -vV"

# The linked elivagar and protohoggr crates are reached through one seam, so
# a change in their API touches one file. The crate root and the modules that
# import brokkr's own `elivagar` module by that bare name are excluded: there
# `elivagar::` is the local module, not the dependency.
[[textlint]]
name = "elivagar-crates-through-the-seam"
pattern = '(?:^|[^:\w])(?:elivagar|protohoggr)::'
paths = ["src/**/*.rs"]
exclude = ["src/elivagar/eliv.rs", "src/main.rs", "src/main_parts/bootstrap.rs", "src/main_parts/dispatch.rs", "src/verify_cmd.rs"]
region = "code"
message = "reach the elivagar and protohoggr crates through src/elivagar/eliv.rs"

# pbfhogg's overwrite boundary (src/pbfhogg/binary.rs): code under src/pbfhogg
# may hold a pbfhogg executable brokkr built only as a PbfhoggBinary, so it
# cannot pair one with arguments that skipped --overwrite negotiation. The
# runner's executable is guarded by types (its path needs a key only the
# handle can make, and Invocation::built refuses a pbfhogg executable); these
# two rules guard the remaining seams that hand out a built executable path:
# free items of crate::build (by call, value or import), harness_build,
# check_cmd, cargo spawned directly, and the session's binary(): any member
# named binary, and any path item named binary other than a module segment
# (`pbfhogg::binary::`), however it is then called, cast or bound.
# The osmpbf baseline is built through tools::osmpbf_baseline, a resolver
# whose manifest is fixed, so it cannot build pbfhogg; the rule has no
# exceptions. Raw identifiers (`r#binary`) are matched. Line patterns are
# syntax: they assume rustfmt layout, which keeps a path and a method call on
# one line, and an identifier a macro assembles from separate tokens is
# outside them. A new module that hands out built executables must be added
# here. Outside the claim, by design: PATH lookup, a path derived from data,
# calling another command whole, and macro-assembled references.
[[textlint]]
name = "pbfhogg-executables-through-the-handle"
pattern = '\bbuild::(?:[a-z_]\w*|\{|\*)|\bbuild\s+as\b|\bharness_build\b|\bcheck_cmd\b|\brun_cargo\w*|\.\s*(?:r#)?binary\b|::\s*(?:r#)?binary\b(?:[^:]|$)'
paths = ["src/pbfhogg/**/*.rs"]
exclude = ["src/pbfhogg/binary.rs"]
region = "code"
test_code = "skip"
must_scan = ["src/pbfhogg/bench_all.rs", "src/pbfhogg/verify.rs"]
message = "pbfhogg executables reach src/pbfhogg only as a PbfhoggBinary; build, wrap and spawn through src/pbfhogg/binary.rs"

# The same seams as imports, matched against whole reconstructed `use`
# statements, so a rustfmt-wrapped or oddly split import (`build` on one line,
# `as x` on the next) cannot alias them past the line rule above.
[[textlint]]
name = "pbfhogg-executable-seams-not-imported"
pattern = '\bbuild\s*(?:as\b|::\s*(?:[a-z_]|\{|\*))|\bharness_build\b|\bcheck_cmd\b|\brun_cargo\w*'
paths = ["src/pbfhogg/**/*.rs"]
exclude = ["src/pbfhogg/binary.rs"]
join_wrapped_use = true
message = "import the build seams only in src/pbfhogg/binary.rs; elsewhere in src/pbfhogg a pbfhogg executable is a PbfhoggBinary"

# The probe builds this tree's guard in its own persistent target dir and gives
# each invocation a private HOME and private lock files. It does not touch the
# live lock or need `brokkr install`.
[[script_check]]
name = "rustc-guard-decision-probe"
command = "python3 scripts/guard-decision-probe.py"
expect = "all guard decision paths behaved as specified"
match = "last-line"
stage = "pre-test"

# A deletion, rename or replacement of a path a pbfhogg launch can use goes
# through the reservation gate (src/reservations), which refuses while a
# launch's lease covers the path. The code that deletes pbfhogg's inputs,
# outputs and scratch must not reach std::fs around it.
[[textlint]]
name = "pbfhogg-mutations-through-the-gate"
pattern = '\bfs::(?:remove_file|remove_dir_all|rename)\b'
paths = ["src/pbfhogg/**/*.rs", "src/measure/**/*.rs", "src/measure.rs", "src/atomic_write.rs"]
region = "code"
test_code = "skip"
# A raw call carries this marker with its reason: the operation a
# crate::reservations::mutate or Hold::release_then closure performs under the
# gate, or a file that is brokkr's own state, which no launch uses.
allow_marker = "// gate:"
message = "delete, rename or replace through crate::reservations, which refuses while a launch's lease covers the path"

# Even data-printer lint exceptions must not hand-roll operator prefixes.
[[textlint]]
name = "operator-prefixes-use-output"
pattern = '(?:e?print(?:ln)?!|plain(?:_stderr)?)\s*\(\s*(?:&format!\s*\(\s*)?"\[(?:build|run|result|bench|verify|hotpath|download|lock|strays|guard|sidecar|error|warn|test|ratatoskr|corpus|lint|litehtml|sluggrs|install)\]'
paths = ["src/**/*.rs"]
exclude = ["src/output/console.rs"]
message = "send operator messages through the matching output printer"

[[textlint]]
name = "warnings-use-output-levels"
pattern = '\[warn\]|WARNING:'
paths = ["src/**/*.rs"]
exclude = ["src/output/console.rs"]
region = "string"
message = "use output::warn rather than embedding a warning tag in another level"
