project = "brokkr"

# Two bin targets since brokkr-rustc-guard; keep bare `brokkr run` on brokkr.
[bin]
default = "brokkr"

[test]
debug = true
default_package = "brokkr"
# Rustdoc is the one compiler pass clippy and the tests never run, so a broken
# intra-doc link in a module header rots unseen. brokkr is a binary crate whose
# doc comments are written for its own developers, so private items are
# documented too.
[rustdoc]
document_private_items = true

# The document-folder rule from CLAUDE.md: docs may not cite source line
# numbers, because they drift the moment the file is edited. Cite the file and
# the symbol instead.
[[textlint]]
name = "docs-cite-no-line-numbers"
pattern = '\b[\w/.-]+\.rs:\d+'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md"]
message = "source line numbers drift; cite the file and the symbol instead"

# The one-way dependency direction from CLAUDE.md: `notes/` carries no truth
# guarantee, so nothing durable may cite it - not a doc, not a code comment,
# which outlives the note it would point at.
[[textlint]]
name = "docs-never-cite-notes"
pattern = '\bnotes/'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md", "scripts/**/*.js", "scripts/**/*.py", "scripts/**/*.sh"]
message = "notes/ is transient; durable docs must carry their own context"

[[textlint]]
name = "durable-docs-avoid-machine-local-paths"
pattern = '/home/'
paths = ["README.md", "CLAUDE.md", "docs/**/*.md"]
message = "durable docs must use portable paths"

# Old tracker labels and machine-local paths are not durable context. Scoped
# to the config/CLI/dispatch layer: other modules still carry such labels, and
# a path joins this list once it is clean.
[[textlint]]
name = "owned-source-comments-have-durable-context"
pattern = '\bS\d+-\d+\b|\b(?:TODO|request|plan|Phase|feature)\s+#?\d+\b|\bQ\d+:|\bC\d+\b|[\w/.-]+\.rs:\d+|/home/'
paths = ["src/config_parts/**/*.rs", "src/project.rs", "src/cli.rs", "src/cli/**/*.rs", "src/command_args.rs", "src/man.rs", "src/man/**/*.rs", "src/main_parts/**/*.rs"]
region = "comment"
message = "comments must explain durable behavior without tracker labels or local paths"

[[textlint]]
name = "owned-source-strings-have-durable-context"
pattern = '\bS\d+-\d+\b|\b(?:TODO|request|plan|Phase|feature)\s+#?\d+\b|\bQ\d+:|\bC\d+\b|[\w/.-]+\.rs:\d+|\bnotes/|/home/'
paths = ["src/config_parts/**/*.rs", "src/project.rs", "src/cli.rs", "src/cli/**/*.rs", "src/command_args.rs", "src/man.rs", "src/man/**/*.rs", "src/main_parts/**/*.rs"]
exclude = ["src/config_parts/tests.rs"]
region = "string"
message = "user-facing strings must not expose tracker labels or machine-local paths"

[[textlint]]
name = "dataset-defaults-have-one-owner"
pattern = 'default_value\s*=\s*"(?:denmark|raw|indexed)"'
paths = ["src/cli/schema.rs"]
region = "code"
message = "use the shared dataset and variant defaults from src/cli/schema.rs"

# The same rule for code comments. `region = "comment"` because string literals
# legitimately name `notes/` paths, as test data for the dirt classifier does.
[[textlint]]
name = "comments-never-cite-notes"
pattern = '\bnotes/'
paths = ["src/**/*.rs"]
region = "comment"
message = "notes/ is transient; a code comment must carry its own context"

# Project and per-user state paths belong to the typed layout owners.
[[textlint]]
name = "brokkr-state-paths-use-layouts"
pattern = '"(?:[^"]*[/"])?\.brokkr(?:/|")'
paths = ["src/**/*.rs"]
exclude = ["src/clean/layout.rs", "src/user_dirs.rs", "src/user_dirs/paths.rs", "src/lock_protocol.rs"]
region = "string"
message = "construct .brokkr paths through ProjectState, a project layout, or user_dirs"

# The toolchain probe has one owner, which caches it per invocation. The guard
# binary's argument classifier recognises the flag; it never runs it.
[[textlint]]
name = "rustc-version-probe-has-one-owner"
pattern = '-vV\b'
paths = ["src/**/*.rs"]
exclude = ["src/cargo/rustc.rs", "src/bin/rustc_guard.rs"]
region = "string"
message = "query the toolchain through crate::cargo::rustc::load, not a fresh rustc -vV"

# The linked elivagar and protohoggr crates are reached through one seam, so
# a change in their API touches one file. The crate root and the modules that
# import brokkr's own `elivagar` module by that bare name are excluded: there
# `elivagar::` is the local module, not the dependency.
[[textlint]]
name = "elivagar-crates-through-the-seam"
pattern = '(?:^|[^:\w])(?:elivagar|protohoggr)::'
paths = ["src/**/*.rs"]
exclude = ["src/elivagar/eliv.rs", "src/main.rs", "src/main_parts/bootstrap.rs", "src/verify_cmd.rs"]
region = "code"
message = "reach the elivagar and protohoggr crates through src/elivagar/eliv.rs"

# The probe gives each guard invocation a private HOME and private lock files.
# It tests the installed wrapper directly and does not touch the live lock.
# The installed wrapper is the last `brokkr install`, not this tree's code, and
# a host without it fails the check with a pointer to `brokkr install`.
[[script_check]]
name = "rustc-guard-decision-probe"
command = "python3 scripts/guard-decision-probe.py \"${CARGO_HOME:-$HOME/.cargo}/bin/brokkr-rustc-guard\""
expect = "all guard decision paths behaved as specified"
match = "last-line"
stage = "pre-clippy"
