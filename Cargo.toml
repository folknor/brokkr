[package]
name = "brokkr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared development tooling for multiple Rust and data projects"
# Every bin is declared explicitly below; without this, target
# auto-discovery would also pick up the files under src/bin/ under their
# file names and build them twice under two names.
autobins = false

[[bin]]
name = "brokkr"
path = "src/main.rs"

# The rustc-wrapper fence: enrolled user-wide by `brokkr guard --install` as
# `build.rustc-wrapper`, it refuses to compile while the brokkr lock is held
# unless the invoking cargo runs under brokkr. Ships alongside `brokkr` via
# `cargo install --path .`, which installs every bin target.
[[bin]]
name = "brokkr-rustc-guard"
path = "src/bin/rustc_guard.rs"

# The results server: the bench store (src/bench/store/, included by path)
# behind HTTP, run by whoever hosts one. Installed with the others, unused
# until started.
[[bin]]
name = "brokkr-results-server"
path = "src/bin/results_server/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.3"
toml_edit = "0.25.13"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: decimals parse correctly rounded, as pbfhogg parses them,
# so verify's polygon gate reads the coordinates pbfhogg reads.
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
libc = "0.2.191"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18"
regex = "1"
globset = "0.4"
# The rust-lang tokenizer, as rust-analyzer republishes it: tracks current
# token syntax (raw C strings, guarded string prefixes), which textlint's
# region masking and `skip_test` admission must not misread.
ra-ap-rustc_lexer = "0.183.0"
# Not used directly. The lexer asserts at compile time that unicode-ident and
# unicode-properties carry the same Unicode version, but its own requirements
# admit pairs that disagree. This pins unicode-ident to the release line
# matching the locked unicode-properties; when the assertion fails the build
# after an update, move this requirement (a floor or a cap) to the matching
# release rather than reverting the update.
unicode-ident = "1.0.25"
# `[[textlint]] skip_test`: the test-code classifier (src/test_code/) parses
# every reachable workspace file to find attributed nodes and module edges.
# Spans must map back to byte offsets in the file outside a proc-macro
# context, which is what `span-locations` provides.
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `brokkr man`: the bundled docs are markdown, rendered to ANSI for the
# terminal. Both are leaf crates with no transitive dependencies of their own.
pulldown-cmark = { version = "0.13.5", default-features = false }
owo-colors = "4"
# The corpus gate links elivagar in-process (reader/decoder/writer surface) and
# reuses protohoggr's MVT cursor for the ported streaming tile hash. See
# src/elivagar/eliv.rs (the seam) and src/elivagar/corpus/canonical.rs.
elivagar = "0.1.0"
protohoggr = "0.5.0"
# Script benches (`[bench.*]` in brokkr.toml) are Lua run by dellingr, a pure
# Rust VM; `brokkr check` compiles every bench's script with it and resolves
# the script's global names from the ones dellingr records while compiling it.
# Reached only
# through src/bench/lua.rs (the seam), since brokkr's own `dellingr` module
# shares the name.
dellingr = "0.7.1"
# `brokkr regress`: the three-pass engine fans the raw/canonical/detail passes
# over blob pairs, and the matcher/grouping code is keyed by hash maps hot enough
# that SipHash showed up in the original. Both were elivagar's dependencies
# before the adjudication layer moved here; they carry the same roles.
rayon = "1.11"
rustc-hash = "2"
# nextest, BUNDLED rather than shelled out to. brokkr links the engine and
# drives `list::TestList` + `runner` in-process, the same seam as the elivagar
# corpus gate (src/elivagar/eliv.rs): no `cargo-nextest` on PATH, no per-host
# install step, and no JSON round-trip - the coverage enumeration reads typed
# values straight off the list.
#
# The trade taken deliberately: the nextest version is now brokkr's pin, not
# whatever the host happens to have, so skew against a project's CI nextest is a
# choice we make here rather than a fact we observe. Record the linked version in
# run provenance so a gate result says which engine produced it.
#
# nextest-runner is a 0.x with no API stability promise; Cargo.lock is committed,
# so upgrades are deliberate work rather than drift. Default features only -
# `self-update` (rustls/aws-lc-rs/ureq), `config-schema` and `usdt` stay off.
nextest-runner = "0.129.0"
# The summary/ID types (RustBinaryId, TestCaseName, FilterMatch, MismatchReason).
# A dependency of nextest-runner too, declared explicitly because brokkr names
# these types directly rather than reaching through the runner for them.
nextest-metadata = "0.15"
# The nextest lane's supporting cast, all dependencies of nextest-runner
# already, declared because brokkr names their types directly: guppy's
# PackageGraph feeds config parsing and artifact resolution, nextest-filtering
# compiles the package-qualified skip translation, camino is the path
# vocabulary the whole API speaks.
# guppy, nextest-filtering and nextest-metadata must each match the version
# nextest-runner links, or its types and ours are distinct and the lane won't
# compile. Before bumping the runner, read the [workspace.dependencies] of the
# nextest repo's root Cargo.toml at its nextest-runner-X.Y.Z tag; these pins
# move when the runner's do, never before.
guppy = "0.19.1"
nextest-filtering = "0.23.0"
camino = "1"
# The results server's HTTP stack (src/bin/results_server/): hyper's HTTP/1.1
# server on the tokio nextest-runner already links, which adds `net` here.
# A maintained stack rather than a hand-written one; HTTP/1.1 only, since the
# server sits behind a TLS proxy that speaks it to the backend.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# brokkr's client of a results server (src/bench/remote.rs): blocking, as the
# rest of brokkr is, with rustls (ring, webpki roots) because the documented
# deployment is HTTPS behind a TLS proxy. Defaults off: no gzip, since the
# server never compresses.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
# The results server's job-race tests run the handler on a paused clock, so
# its wait expires when the test says, not when the scheduler does.
tokio = { version = "1.54.1", features = ["test-util"] }

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
